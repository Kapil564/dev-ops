name: TaskBoard Python CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
env:
  REGISTRY: ghcr.io
  REPO_OWNER: kapil564

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend
      - name: Run backend tests
        run: pytest -q
        working-directory: backend
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build frontend
        run: npm install && npm run build
        working-directory: frontend

  build-scan-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images
        run: |
          docker build -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }} -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:latest ./backend
          docker build -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }} -t ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:latest ./frontend
      - name: Scan backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Push images
        run: |
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-backend:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.REPO_OWNER }}/taskboard-frontend:latest

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-scan-push
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: read}
    env:
      KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
    steps:
      - name: Check Kubeconfig secret
        id: check_kubeconfig
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "KUBE_CONFIG_DATA secret is not provided; skipping automated deployment."
          else
            echo "has_secret=true" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v4
        if: steps.check_kubeconfig.outputs.has_secret == 'true'
      - uses: azure/setup-helm@v4
        if: steps.check_kubeconfig.outputs.has_secret == 'true'
      - name: Configure kubectl
        if: steps.check_kubeconfig.outputs.has_secret == 'true'
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG_DATA" | base64 -d > ~/.kube/config
      - name: Deploy with Helm
        if: steps.check_kubeconfig.outputs.has_secret == 'true'
        run: |
          helm upgrade --install taskboard ./helm/taskboard -n taskboard --create-namespace \
            --set backend.tag=${{ github.sha }} \
            --set frontend.tag=${{ github.sha }}

